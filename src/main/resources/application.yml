server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: autoandes-backend
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:AUTOANDES}
    password: ${ORACLE_PASSWORD:}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: America/Lima

autoandes:
  jwt:
    secret: ${JWT_SECRET:local-only-replace-with-a-secret-of-at-least-32-bytes}
    expiration-seconds: 3600
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.autoandes: INFO
    org.hibernate.SQL: WARN
